{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 rounded-4 p-4">
                <h2 class="fw-bold text-center text-flashbite mb-4">Welcome Back</h2>
                
                <form class="login" method="POST" action="{% url 'account_login' %}">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger small">
                            Invalid email or password. Please try again.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label fw-bold">Email Address</label>
                        <input type="email" name="login" class="form-control form-control-lg bg-light" placeholder="you@example.com" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg bg-light" placeholder="••••••••" required>
                    </div>
                    
                    <button class="btn btn-flashbite btn-lg w-100 fw-bold mb-3" type="submit">Log In</button>
                    
                    <div class="text-center mt-3">
                        <p class="text-muted mb-0">Don't have an account? <a href="{% url 'account_signup' %}" class="text-flashbite fw-bold text-decoration-none">Sign up here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
