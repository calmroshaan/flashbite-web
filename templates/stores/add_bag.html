{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold m-0">Post a Surprise Bag</h2>
                <a href="{% url 'stores:owner_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        {{ form.as_p }}

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-flashbite btn-lg fw-bold">Publish Bag</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
