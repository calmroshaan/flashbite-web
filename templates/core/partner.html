{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-3 p-4">
                <h2 class="fw-bold mb-3 text-center">Become a FlashBite Partner</h2>
                <p class="text-muted text-center mb-4">Fill out the details below. Our team will review your application quickly!</p>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 fw-bold mt-3">Submit Application</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
